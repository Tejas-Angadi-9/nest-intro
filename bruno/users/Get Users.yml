info:
  name: Get Users
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/users/1/2?limit=10&offset=20"
  headers:
    - name: Content-Type
      value: application/json
  params:
    - name: limit
      value: "10"
      type: query
    - name: offset
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
